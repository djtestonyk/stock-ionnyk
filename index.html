<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock IONNYK</title>
  
  <!-- Tailwind optimisé (plus rapide) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: [],
      theme: { extend: {} }
    }
  </script>

  <!-- QR Code scanner (déjà léger) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-md mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Stock IONNYK</h1>

    <!-- Choix Home page -->
    <div id="home-selection" class="mb-8">
      <div class="display: block">
        <button onclick="selectHome('Site')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Choisir un site</button>
        <button onclick="viewStock()" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Voir stock vente</button>
      </div>
    </div>

    <!-- Choix du site -->
    <div id="site-selection" class="mb-8">
      <h2 class="text-xl mb-4">Choisis un site :</h2>
      <div class="display: block">
        <button onclick="selectSite('Bierges')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Bierges</button>
        <button onclick="selectSite('Serviplast')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Serviplast</button>
        <button onclick="selectSite('La Hulpe')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">La Hulpe</button>
      </div>
    </div>

    <!-- Après sélection -->
    <div id="main-app" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <div>Site : <span id="current-site" class="font-bold text-emerald-400"></span></div>
        <button onclick="logoutSite()" class="font-bold text-emerald-400 text-sm underline">Retour</button>
      </div>

      <button onclick="startScanner()" 
              class="w-full bg-white text-black font-bold py-6 rounded-3xl text-2xl flex items-center justify-center gap-3">
        📷 Scan QR Code
      </button>

      <button onclick="viewStock()" 
              class="w-full mt-3 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl">
        Voir le stock actuel
      </button>
    </div>
  </div>

  <!-- Scanner modal -->
  <div id="scanner-modal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="p-4 flex justify-between">
      <button onclick="stopScanner()" class="text-white text-xl">✕</button>
      <h3 class="text-xl">Scan QR Code</h3>
    </div>
    <div id="reader" class="flex-1"></div>
  </div>

  <!-- Modal résultat scan -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
    <div class="bg-zinc-900 rounded-3xl p-8 max-w-sm w-full mx-4">
      <h3 class="text-2xl mb-2">Produit détecté</h3>
      <p id="product-name" class="text-emerald-400 text-3xl font-bold mb-6"></p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Quantité</label>
          <input id="qty-input" type="number" value="1" class="w-full bg-zinc-800 rounded-2xl p-4 text-3xl text-center">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <button onclick="updateStock(1)" 
                  class="bg-emerald-600 hover:bg-emerald-500 py-6 rounded-2xl font-bold text-xl">+ AJOUTER</button>
          <button onclick="updateStock(-1)" 
                  class="bg-red-600 hover:bg-red-500 py-6 rounded-2xl font-bold text-xl">- RETIRER</button>
        </div>
      </div>

      <button onclick="closeModal()" class="w-full mt-6 text-zinc-400">Annuler</button>
    </div>
  </div>

  <script>
    let currentPage = null;
    let html5QrCode = null;
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXmPYDNi4zhgK9fumpZkW1nSTsYjjB88aYGz08Re5Q2Sy0J_DdZF4Dnav1sI5RRfda2g/exec"; // ← Remplace par ton URL Apps Script

    const productMap = {
      "MAXINE": "Maxine Masterpiece",
      "JANE": "Jane Classic Format",
      "LINN": "Linn Large Format",
      "maxine": "Maxine Masterpiece",
      "jane": "Jane Classic Format",
      "linn": "Linn Large Format"
    };

    function selectHome(home) {
      currentPage = home;
      document.getElementById('home-selection').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('current-page').textContent = home;
      localStorage.setItem('selectedPage', home);
    }

    function selectSite(site) {
      currentPage = site;
      document.getElementById('site-selection').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('current-site').textContent = site;
      localStorage.setItem('selectedSite', site);
    }

    function logoutSite() {
      localStorage.removeItem('selectedSite');
      location.reload();
    }

    // Charger le site déjà choisi
    if (localStorage.getItem('selectedSite')) {
      selectSite(localStorage.getItem('selectedSite'));
    }

    function startScanner() {
      document.getElementById('scanner-modal').classList.remove('hidden');
      
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScanner();
          handleQR(decodedText);
        },
        (error) => {} // pas d'erreur affichée
      ).catch(err => alert("Erreur caméra : " + err));
    }

    function stopScanner() {
      if (html5QrCode) html5QrCode.stop();
      document.getElementById('scanner-modal').classList.add('hidden');
    }

    function handleQR(code) {
      const ref = productMap[code.trim()];
      if (!ref) {
        alert("QR Code inconnu : " + code);
        return;
      }
      document.getElementById('product-name').textContent = ref;
      document.getElementById('result-modal').classList.remove('hidden');
      window.currentRef = ref; // on garde en mémoire
    }

       function updateStock(sign) {
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      const delta = sign * qty;

      if (!currentPage || !window.currentRef) {
        alert("Erreur : site ou référence manquante");
        return;
      }

      const payload = {
        site: currentPage,
        ref: window.currentRef,
        delta: delta
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: {
          "Content-Type": "text/plain;charset=utf-8"   // ← Cette ligne est la correction principale
        },
        redirect: "follow"   // Important pour suivre la redirection Google
      })
      .then(r => {
        if (!r.ok) {
          throw new Error(`HTTP error! status: ${r.status}`);
        }
        return r.json();
      })
      .then(data => {
        if (data.success) {
          alert(`✅ Mise à jour réussie !\nNouveau stock : ${data.newStock}`);
          closeModal();
        } else {
          alert("Erreur du serveur : " + (data.error || "Inconnue"));
        }
      })
      .catch(err => {
        console.error(err);
        alert("Erreur de connexion :\n" + err.message + "\n\nVérifie ta connexion ou redéploie l'Apps Script.");
      });
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

        function viewStock() {
      fetch(SCRIPT_URL)
        .then(r => {
          if (!r.ok) throw new Error("Erreur réseau");
          return r.json();
        })
        .then(data => {
          if (!Array.isArray(data) || data.length < 2) {
            alert("Aucune donnée trouvée");
            return;
          }

          let html = `
            <div class="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
              <div class="bg-zinc-900 rounded-3xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
                <div class="p-6 border-b border-zinc-700 flex justify-between items-center">
                  <h2 class="text-2xl font-bold">Stock Actuel - IONNYK</h2>
                  <button onclick="this.closest('.fixed').remove()" 
                          class="text-3xl leading-none text-zinc-400 hover:text-white">×</button>
                </div>
                
                <div class="overflow-auto flex-1 p-4">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="border-b border-zinc-700">
                        <th class="py-4 px-4 font-medium text-emerald-400">Référence</th>
                        <th class="py-4 px-4 text-center font-medium">Bierges</th>
                        <th class="py-4 px-4 text-center font-medium">Serviplast</th>
                        <th class="py-4 px-4 text-center font-medium">La Hulpe</th>
                      </tr>
                    </thead>
                    <tbody class="text-zinc-300">
          `;

          // On saute la première ligne (en-têtes)
          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const ref = row[0] || "Inconnu";
            const bierges = row[1] !== undefined ? row[1] : 0;
            const servi = row[2] !== undefined ? row[2] : 0;
            const hulpe = row[3] !== undefined ? row[3] : 0;

            html += `
              <tr class="border-b border-zinc-800 hover:bg-zinc-800/50">
                <td class="py-4 px-4 font-medium">${ref}</td>
                <td class="py-4 px-4 text-center font-mono text-emerald-400">${bierges}</td>
                <td class="py-4 px-4 text-center font-mono text-emerald-400">${servi}</td>
                <td class="py-4 px-4 text-center font-mono text-emerald-400">${hulpe}</td>
              </tr>
            `;
          }

          html += `
                    </tbody>
                  </table>
                </div>
                
                <div class="p-4 border-t border-zinc-700 text-center">
                  <button onclick="this.closest('.fixed').remove()" 
                          class="bg-zinc-700 hover:bg-zinc-600 px-8 py-3 rounded-2xl font-medium">
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          `;

          // Afficher le tableau
          const modal = document.createElement('div');
          modal.innerHTML = html;
          document.body.appendChild(modal);
        })
        .catch(err => {
          alert("Impossible de charger le stock :\n" + err.message);
        });
    }
  </script>
</body>
</html>
