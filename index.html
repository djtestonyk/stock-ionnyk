<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock IONNYK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <style>
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    #reader video { border-radius: 0; }
    .site-btn { display: block; width: 100%; margin-bottom: 12px; transition: background 0.15s; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-md mx-auto p-4 pb-12">

    <!-- Header -->
    <div class="text-center pt-8 pb-6">
      <div class="text-4xl mb-2">📦</div>
      <h1 class="text-2xl font-bold tracking-wide">Stock IONNYK</h1>
    </div>

    <!-- HOME -->
    <div id="home-selection">
      <button onclick="goTo('sites')"
              class="site-btn bg-zinc-800 hover:bg-emerald-600 p-5 rounded-2xl text-lg font-semibold">
        📍 Choisir un site &amp; scanner
      </button>
      <button onclick="viewStock()"
              class="site-btn bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl text-lg font-semibold">
        📊 Voir le stock vente
      </button>
    </div>

    <!-- SITE SELECTION -->
    <div id="site-selection" class="hidden">
      <button onclick="backToHome()" class="text-emerald-400 text-sm underline mb-4 block">← Retour</button>
      <h2 class="text-lg text-zinc-400 mb-4 font-medium">Choisis un site :</h2>
      <button onclick="selectSite('Bierges')"    class="site-btn bg-zinc-800 hover:bg-emerald-600 p-5 rounded-2xl text-lg font-semibold">🏢 Bierges</button>
      <button onclick="selectSite('Serviplast')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-5 rounded-2xl text-lg font-semibold">🏭 Serviplast</button>
      <button onclick="selectSite('La Hulpe')"   class="site-btn bg-zinc-800 hover:bg-emerald-600 p-5 rounded-2xl text-lg font-semibold">🏠 La Hulpe</button>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <button onclick="backToSites()" class="text-emerald-400 text-sm underline">← Retour</button>
        <div class="text-right">
          <div class="text-xs text-zinc-500 uppercase tracking-wide">Site actif</div>
          <div id="current-site" class="font-bold text-emerald-400 text-lg"></div>
        </div>
      </div>

      <button onclick="startScanner()"
              class="w-full bg-white text-black font-bold py-8 rounded-3xl text-2xl flex items-center justify-center gap-3 mb-4 hover:bg-zinc-100 transition-colors">
        📷 Scanner un QR Code
      </button>

      <button onclick="viewStock()"
              class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl font-medium transition-colors">
        📊 Voir le stock actuel
      </button>
    </div>

  </div>

  <!-- SCANNER MODAL -->
  <div id="scanner-modal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="p-4 flex justify-between items-center">
      <button onclick="stopScanner()" class="text-white text-3xl leading-none">✕</button>
      <span class="text-lg font-semibold">Scanner un cadre</span>
      <div class="w-8"></div>
    </div>
    <div class="px-4 pb-2 text-center text-zinc-400 text-sm">Pointe le QR code du cadre</div>
    <div id="reader" class="flex-1"></div>
  </div>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/85 z-50 flex items-end sm:items-center justify-center">
    <div class="bg-zinc-900 rounded-t-3xl sm:rounded-3xl p-8 w-full max-w-sm mx-0 sm:mx-4 fade-in">
      <div class="text-center mb-6">
        <div class="text-zinc-400 text-sm uppercase tracking-wider mb-1">Produit détecté</div>
        <p id="product-name" class="text-emerald-400 text-2xl font-bold leading-tight"></p>
        <div class="text-zinc-500 text-sm mt-1">Site : <span id="modal-site" class="text-zinc-300"></span></div>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-zinc-400 mb-2 text-center">Quantité</label>
        <div class="flex items-center gap-3">
          <button onclick="changeQty(-1)" class="w-12 h-12 bg-zinc-700 hover:bg-zinc-600 rounded-xl text-2xl font-bold flex-shrink-0">−</button>
          <input id="qty-input" type="number" value="1" min="1" max="999"
                 class="flex-1 bg-zinc-800 rounded-2xl p-3 text-3xl text-center font-mono border border-zinc-700 focus:outline-none focus:border-emerald-500">
          <button onclick="changeQty(1)"  class="w-12 h-12 bg-zinc-700 hover:bg-zinc-600 rounded-xl text-2xl font-bold flex-shrink-0">+</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="updateStock(1)"
                class="bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-bold text-lg transition-colors">
          ＋ AJOUTER
        </button>
        <button onclick="updateStock(-1)"
                class="bg-red-600 hover:bg-red-500 py-5 rounded-2xl font-bold text-lg transition-colors">
          － RETIRER
        </button>
      </div>

      <button onclick="closeModal()" class="w-full text-zinc-500 hover:text-zinc-300 py-2 transition-colors text-sm">
        Annuler
      </button>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-black/70 z-[200] flex items-center justify-center">
    <div class="bg-zinc-900 rounded-2xl p-8 text-center">
      <div class="text-4xl mb-3 animate-spin inline-block">⏳</div>
      <div class="text-zinc-300">Mise à jour en cours…</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXmPYDNi4zhgK9fumpZkW1nSTsYjjB88aYGz08Re5Q2Sy0J_DdZF4Dnav1sI5RRfda2g/exec";

    // ✅ Map exact = valeurs dans Google Sheet colonne A
    const productMap = {
      "Maxine Masterpiece": "Maxine Masterpiece",
      "Jane Classic Format": "Jane Classic Format",
      "Linn Large Format": "Linn Large Format",
      "Affresco 13.3\"": "Affresco 13.3\"",
      "Affresco 31.5\"": "Affresco 31.5\"",
      "Tela 28.5\"": "Tela 28.5\"",
      "Tela 40.5\"": "Tela 40.5\"",
      "Duna 40.5\"": "Duna 40.5\""
    };

    let currentSite = null;
    let html5QrCode = null;
    let scanning = false;
    let currentRef = null;

    const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem('selectedSite');
      if (saved) {
        currentSite = saved;
        document.getElementById('current-site').textContent = saved;
      }
      goTo("home");
    });

    function goTo(page) {
      ['home-selection','site-selection','main-app'].forEach(id =>
        document.getElementById(id).classList.add('hidden')
      );
      if (page === "home")  document.getElementById('home-selection').classList.remove('hidden');
      if (page === "sites") document.getElementById('site-selection').classList.remove('hidden');
      if (page === "app")   document.getElementById('main-app').classList.remove('hidden');
    }

    function selectSite(site) {
      currentSite = site;
      localStorage.setItem('selectedSite', site);
      document.getElementById('current-site').textContent = site;
      document.getElementById('modal-site').textContent = site;
      goTo("app");
    }

    function backToHome()  { goTo("home"); }
    function backToSites() { goTo("sites"); }

    function changeQty(delta) {
      const input = document.getElementById('qty-input');
      const val = parseInt(input.value) || 1;
      input.value = Math.max(1, val + delta);
    }

    function startScanner() {
      document.getElementById('scanner-modal').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 260 } },
        (decodedText) => {
          stopScanner();
          handleQR(decodedText);
        },
        () => {}
      ).catch(err => alert("Erreur caméra : " + err));
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
      }
      document.getElementById('scanner-modal').classList.add('hidden');
    }

    function handleQR(code) {
      if (scanning) return;
      scanning = true;

      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
      beep.play().catch(() => {});

      // Recherche insensible à la casse + trim
      const trimmed = code.trim();
      let ref = null;

      // Recherche exacte d'abord
      if (productMap[trimmed] !== undefined) {
        ref = productMap[trimmed];
      } else {
        // Recherche insensible à la casse
        const lower = trimmed.toLowerCase();
        for (const key of Object.keys(productMap)) {
          if (key.toLowerCase() === lower) {
            ref = productMap[key];
            break;
          }
        }
      }

      if (!ref) {
        alert("QR Code non reconnu.\n\nContenu lu : [" + trimmed + "]\n\nVérifie que ce QR correspond à une référence du stock.");
        scanning = false;
        return;
      }

      currentRef = ref;
      document.getElementById('product-name').textContent = ref;
      document.getElementById('modal-site').textContent = currentSite;
      document.getElementById('qty-input').value = 1;
      document.getElementById('result-modal').classList.remove('hidden');
    }

    function updateStock(sign) {
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      const delta = sign * qty;

      if (!currentSite || !currentRef) {
        alert("Erreur : site ou référence manquante");
        return;
      }

      document.getElementById('loading-overlay').classList.remove('hidden');

      const payload = { site: currentSite, ref: currentRef, delta: delta };

      const controller = new AbortController();
      setTimeout(() => controller.abort(), 10000);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        signal: controller.signal
      })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        document.getElementById('loading-overlay').classList.add('hidden');
        if (data.success) {
          showToast((sign > 0 ? "✅ Ajouté" : "🔻 Retiré") + " — Nouveau stock : " + data.newStock);
          closeModal();
        } else {
          alert("Erreur serveur : " + (data.error || "Inconnue"));
        }
      })
      .catch(err => {
        document.getElementById('loading-overlay').classList.add('hidden');
        alert("Erreur de connexion :\n" + err.message);
      });
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
      scanning = false;
      currentRef = null;
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = `position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
        background:#065f46;color:#fff;padding:14px 24px;border-radius:16px;
        font-weight:600;z-index:9999;white-space:nowrap;font-size:15px;
        box-shadow:0 4px 20px rgba(0,0,0,0.4);animation:fadeIn 0.2s ease;`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function viewStock() {
      const overlay = document.createElement('div');
      overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;
        display:flex;align-items:center;justify-content:center;padding:16px;`;
      overlay.innerHTML = `<div style="background:#18181b;border-radius:24px;width:100%;max-width:500px;
        max-height:90vh;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:20px 24px;border-bottom:1px solid #3f3f46;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:18px;font-weight:700;">📊 Stock IONNYK</span>
          <button onclick="this.closest('[style*=inset]').remove()"
                  style="font-size:28px;line-height:1;color:#71717a;background:none;border:none;cursor:pointer;">×</button>
        </div>
        <div style="overflow:auto;flex:1;padding:12px;">
          <div style="text-align:center;padding:32px;color:#71717a;">Chargement…</div>
        </div>
      </div>`;
      document.body.appendChild(overlay);

      fetch(SCRIPT_URL)
        .then(r => { if (!r.ok) throw new Error("Erreur réseau"); return r.json(); })
        .then(data => {
          if (!Array.isArray(data) || data.length < 2) {
            overlay.querySelector('[style*="overflow:auto"]').innerHTML =
              '<div style="text-align:center;padding:32px;color:#f87171;">Aucune donnée trouvée</div>';
            return;
          }

          let rows = '';
          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const ref = row[0] || '—';
            const b   = row[1] !== undefined ? row[1] : 0;
            const s   = row[2] !== undefined ? row[2] : 0;
            const h   = row[3] !== undefined ? row[3] : 0;
            rows += `<tr style="border-bottom:1px solid #27272a;">
              <td style="padding:12px 10px;font-weight:600;font-size:13px;">${ref}</td>
              <td style="padding:12px 10px;text-align:center;font-family:monospace;color:#34d399;font-size:16px;">${b}</td>
              <td style="padding:12px 10px;text-align:center;font-family:monospace;color:#34d399;font-size:16px;">${s}</td>
              <td style="padding:12px 10px;text-align:center;font-family:monospace;color:#34d399;font-size:16px;">${h}</td>
            </tr>`;
          }

          overlay.querySelector('[style*="overflow:auto"]').innerHTML = `
            <table style="width:100%;border-collapse:collapse;font-size:14px;">
              <thead>
                <tr style="border-bottom:1px solid #3f3f46;">
                  <th style="padding:10px;text-align:left;color:#a1a1aa;font-weight:500;">Référence</th>
                  <th style="padding:10px;text-align:center;color:#a1a1aa;font-weight:500;">Bierges</th>
                  <th style="padding:10px;text-align:center;color:#a1a1aa;font-weight:500;">Serviplast</th>
                  <th style="padding:10px;text-align:center;color:#a1a1aa;font-weight:500;">La Hulpe</th>
                </tr>
              </thead>
              <tbody style="color:#e4e4e7;">${rows}</tbody>
            </table>`;
        })
        .catch(err => {
          overlay.querySelector('[style*="overflow:auto"]').innerHTML =
            `<div style="text-align:center;padding:32px;color:#f87171;">Erreur : ${err.message}</div>`;
        });
    }
  </script>
</body>
</html>
