<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock IONNYK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-md mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Stock IONNYK</h1>

    <!-- Choix du site -->
    <div id="site-selection" class="mb-8">
      <h2 class="text-xl mb-4">Choisis ton dépôt</h2>
      <div class="grid grid-cols-3 gap-3">
        <button onclick="selectSite('Bierges')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Bierges</button>
        <button onclick="selectSite('Serviplast')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">Serviplast</button>
        <button onclick="selectSite('La Hulpe')" class="site-btn bg-zinc-800 hover:bg-emerald-600 p-4 rounded-2xl text-center">La Hulpe</button>
      </div>
    </div>

    <!-- Après sélection -->
    <div id="main-app" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <div>Dépôt : <span id="current-site" class="font-bold text-emerald-400"></span></div>
        <button onclick="logoutSite()" class="text-sm underline">Changer de site</button>
      </div>

      <button onclick="startScanner()" 
              class="w-full bg-white text-black font-bold py-6 rounded-3xl text-2xl flex items-center justify-center gap-3">
        📷 Scanner QR Code
      </button>

      <button onclick="viewStock()" 
              class="w-full mt-3 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl">
        Voir le stock actuel
      </button>
    </div>
  </div>

  <!-- Scanner modal -->
  <div id="scanner-modal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="p-4 flex justify-between">
      <button onclick="stopScanner()" class="text-white text-xl">✕</button>
      <h3 class="text-xl">Scan QR Code</h3>
    </div>
    <div id="reader" class="flex-1"></div>
  </div>

  <!-- Modal résultat scan -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
    <div class="bg-zinc-900 rounded-3xl p-8 max-w-sm w-full mx-4">
      <h3 class="text-2xl mb-2">Produit détecté</h3>
      <p id="product-name" class="text-emerald-400 text-3xl font-bold mb-6"></p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Quantité</label>
          <input id="qty-input" type="number" value="1" class="w-full bg-zinc-800 rounded-2xl p-4 text-3xl text-center">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <button onclick="updateStock(1)" 
                  class="bg-emerald-600 hover:bg-emerald-500 py-6 rounded-2xl font-bold text-xl">+ AJOUTER</button>
          <button onclick="updateStock(-1)" 
                  class="bg-red-600 hover:bg-red-500 py-6 rounded-2xl font-bold text-xl">- RETIRER</button>
        </div>
      </div>

      <button onclick="closeModal()" class="w-full mt-6 text-zinc-400">Annuler</button>
    </div>
  </div>

  <script>
    let currentSite = null;
    let html5QrCode = null;
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqNfO5l-iJb8sWkFUKyFUOpJ-q7l3wao5lZtuZZNU3M4tOqSNpvgWj1mKSmbR6f3brOg/exec"; // ← Remplace par ton URL Apps Script

    const productMap = {
      "MAXINE": "Maxine Masterpiece",
      "JANE": "Jane Classic Format",
      "LINN": "Linn Large Format",
      "maxine": "Maxine Masterpiece",
      "jane": "Jane Classic Format",
      "linn": "Linn Large Format"
    };

    function selectSite(site) {
      currentSite = site;
      document.getElementById('site-selection').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('current-site').textContent = site;
      localStorage.setItem('selectedSite', site);
    }

    function logoutSite() {
      localStorage.removeItem('selectedSite');
      location.reload();
    }

    // Charger le site déjà choisi
    if (localStorage.getItem('selectedSite')) {
      selectSite(localStorage.getItem('selectedSite'));
    }

    function startScanner() {
      document.getElementById('scanner-modal').classList.remove('hidden');
      
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScanner();
          handleQR(decodedText);
        },
        (error) => {} // pas d'erreur affichée
      ).catch(err => alert("Erreur caméra : " + err));
    }

    function stopScanner() {
      if (html5QrCode) html5QrCode.stop();
      document.getElementById('scanner-modal').classList.add('hidden');
    }

    function handleQR(code) {
      const ref = productMap[code.trim()];
      if (!ref) {
        alert("QR Code inconnu : " + code);
        return;
      }
      document.getElementById('product-name').textContent = ref;
      document.getElementById('result-modal').classList.remove('hidden');
      window.currentRef = ref; // on garde en mémoire
    }

    function updateStock(sign) {
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      const delta = sign * qty;

      const payload = {
        site: currentSite,
        ref: window.currentRef,
        delta: delta
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" }
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert(`✅ Mise à jour réussie !\nNouveau stock : ${data.newStock}`);
          closeModal();
        } else {
          alert("Erreur : " + data.error);
        }
      })
      .catch(() => alert("Erreur de connexion"));
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    function viewStock() {
      fetch(SCRIPT_URL)
        .then(r => r.json())
        .then(data => {
          let txt = "Stock actuel :\n\n";
          data.slice(1).forEach(row => {
            txt += `${row[0]} → Bierges:${row[1]} | Serviplast:${row[2]} | La Hulpe:${row[3]}\n`;
          });
          alert(txt);
        })
        .catch(() => alert("Impossible de récupérer le stock"));
    }
  </script>
</body>
</html>
